          y="0.5"
          rx="4.5"
          height="99%"
          stroke="#ff9900"
          width="299"
          fill="#000000"
          stroke-opacity="0"
        />

        
      <g
        data-testid="card-title"
        transform="translate(25, 35)"
      >
        <g transform="translate(0, 0)">
      <text
        x="0"
        y="0"
        class="header"
        data-testid="header"
